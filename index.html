<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>待办清单 ToDoList</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="app">
        <header class="app-header">
            <h1>📝 ToDoList</h1>
            <p>快速记录、完成并管理你的任务</p>
        </header>

        <section class="todo-input-card">
            <form id="todoForm" class="todo-form" autocomplete="off">
                <input id="todoInput" type="text" placeholder="输入一个待办事项..." maxlength="120" required>
                <button type="submit">添加</button>
            </form>
            <div class="toolbar">
                <div class="filters" role="group" aria-label="任务筛选">
                    <button type="button" class="filter-btn active" data-filter="all">全部</button>
                    <button type="button" class="filter-btn" data-filter="active">未完成</button>
                    <button type="button" class="filter-btn" data-filter="completed">已完成</button>
                </div>
                <button id="clearCompletedBtn" type="button" class="clear-btn">清除已完成</button>
            </div>
        </section>

        <section class="todo-list-card">
            <ul id="todoList" class="todo-list" aria-live="polite"></ul>
            <div id="emptyState" class="empty-state">还没有任务，先添加一个吧 ✨</div>
        </section>

        <footer class="stats">
            <span id="totalCount">总计：0</span>
            <span id="activeCount">未完成：0</span>
            <span id="completedCount">已完成：0</span>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
