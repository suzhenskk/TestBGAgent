<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird - 浏览器小游戏</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="game-wrapper">
        <h1>🐤 Flappy Bird</h1>
        <p class="subtitle">按 <strong>空格</strong> / 点击屏幕 让小鸟飞起来</p>

        <section class="hud">
            <div>分数: <span id="score">0</span></div>
            <div>最高分: <span id="bestScore">0</span></div>
        </section>

        <canvas id="gameCanvas" width="400" height="600" aria-label="Flappy Bird 游戏画布"></canvas>

        <section class="controls">
            <button id="startBtn">开始 / 重新开始</button>
            <p id="statusText">点击开始按钮开始游戏</p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
